name: Saha CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit & Security Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite (Offline / No API Key required)
        run: |
          pytest -v

  docker-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: saha:latest

  docker-smoke-test:
    name: Container Smoke & Privilege Drop Test
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax check entrypoint script
        run: |
          sh -n docker-entrypoint.sh

      - name: Build local container image
        run: |
          docker build -t saha:smoke-test .

      - name: Create root-owned test directory with mode 755
        run: |
          sudo mkdir -p /tmp/saha-root-data
          sudo chown 0:0 /tmp/saha-root-data
          sudo chmod 755 /tmp/saha-root-data
          ls -ld /tmp/saha-root-data

      - name: Run container with root-owned volume mount
        run: |
          docker run -d \
            --name saha-smoke \
            -p 8080:8080 \
            -v /tmp/saha-root-data:/data \
            -e SAHA_PUBLIC_MODE=true \
            -e SAHA_REQUIRE_PERSISTENT=true \
            -e NEBIUS_API_KEY=dummy \
            saha:smoke-test

      - name: Wait up to 60s for GET /health and verify assertions
        run: |
          echo "Waiting for container /health to become ready..."
          READY=0
          for i in $(seq 1 60); do
            if curl -s -f http://localhost:8080/health > /tmp/health.json; then
              READY=1
              echo "Health check succeeded after $i seconds."
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Timed out waiting for /health after 60s"
            docker logs saha-smoke
            exit 1
          fi

          echo "GET /health response:"
          cat /tmp/health.json
          echo ""

          # Assert data_persistent=true
          grep '"data_persistent":true' /tmp/health.json || grep '"data_persistent": true' /tmp/health.json || {
            echo "ERROR: Assertion failed - data_persistent=true not found in /health response"
            exit 1
          }

          # Assert GET /tasks without X-Saha-Owner returns 401
          HTTP_STATUS=$(curl -s -o /tmp/tasks.json -w "%{http_code}" http://localhost:8080/tasks)
          echo "GET /tasks response HTTP status (without header): $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 401 ]; then
            echo "ERROR: Assertion failed - expected HTTP 401 from GET /tasks without header, got $HTTP_STATUS"
            cat /tmp/tasks.json
            exit 1
          fi

          # Assert process uid of uvicorn inside container is 10001 via /proc inspection
          UVICORN_UID=$(docker exec saha-smoke sh -c '
            FOUND_UID=""
            for pid_dir in /proc/[0-9]*; do
              if [ -f "$pid_dir/cmdline" ] && grep -q "uvicorn" "$pid_dir/cmdline" 2>/dev/null; then
                FOUND_UID=$(awk "/^Uid:/ {print \$2}" "$pid_dir/status")
                break
              fi
            done
            echo "$FOUND_UID"
          ')
          echo "Uvicorn process UID inside container (from /proc): $UVICORN_UID"
          if [ "$UVICORN_UID" -ne 10001 ]; then
            echo "ERROR: Assertion failed - expected uvicorn process UID 10001, got '$UVICORN_UID'"
            docker exec saha-smoke ps aux || true
            exit 1
          fi

          # Assert docker logs contains entrypoint privilege drop log
          echo "Checking container logs for privilege drop log line..."
          docker logs saha-smoke | grep "running as UID 10001" || {
            echo "ERROR: Assertion failed - entrypoint line 'running as UID 10001' not found in docker logs"
            docker logs saha-smoke
            exit 1
          }

      - name: Stop and cleanup container
        if: always()
        run: |
          docker logs saha-smoke || true
          docker rm -f saha-smoke || true
          sudo rm -rf /tmp/saha-root-data || true

  publish:
    name: Publish Container to GHCR
    runs-on: ubuntu-latest
    needs: [test, docker-build, docker-smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Saha - Persistent, Drift-Resilient Personal AI
